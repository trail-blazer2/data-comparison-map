<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWV Phase 1 Control</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: #fff; padding: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #888; background: #151515; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
    </style>
</head>
<body>
    <h2>Realworldview Data Feed</h2>
    <table>
        <thead>
            <tr>
                <th>Commodity</th>
                <th>Spot Price</th>
                <th>Normalized Volatility (τ)</th>
            </tr>
        </thead>
        <tbody id="data-body">
            <tr><td colspan="3">Loading Modal backend...</td></tr>
        </tbody>
    </table>

    <script>
        // Your active Modal development URL
        const MODAL_URL = "https://ivanmazurov--rwv-phase-1-predict-dev.modal.run";

        async function loadData() {
            try {
                const response = await fetch(MODAL_URL);
                const json = await response.json();
                
                let rows = "";
                for (const [commodity, data] of Object.entries(json.data)) {
                    // Make positive values green, negative values red
                    const tauColor = data.tau_normalized >= 0 ? "positive" : "negative";
                    
                    rows += `
                        <tr>
                            <td><strong>${commodity}</strong></td>
                            <td>$${data.spot_price.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            <td class="${tauColor}">${data.tau_normalized}</td>
                        </tr>
                    `;
                }
                // Inject the rows into the HTML table
                document.getElementById("data-body").innerHTML = rows;
            } catch (error) {
                document.getElementById("data-body").innerHTML = `<tr><td colspan="3" class="negative">Error loading data. Ensure the Modal terminal is still serving.</td></tr>`;
            }
        }
        
        loadData();
    </script>
</body>
</html>
