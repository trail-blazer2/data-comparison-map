<!DOCTYPE html>
<html lang="en"> <!-- Výchozí bude EN, JS to přepne podle uživatele -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- SEO & GOOGLE ADS PREPARATION -->
  <title>RealWorldView - Predictive Macro Intelligence</title>
  <meta name="description" content="Shape the future of global economy, demographics, and commodity markets. Join the most advanced predictive intelligence tool.">
  <meta name="keywords" content="data prediction, macro economy, commodity prices, AI investing, data map, RealWorldView">
  
  <!-- OpenGraph -->
  <meta property="og:title" content="RealWorldView - Predict the Future of Markets">
  <meta property="og:description" content="Contribute your predictions on global supply chains, AI, and geopolitics to our global algorithm.">
  <meta property="og:type" content="website">
  
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  
  <style>
    html, body { 
      margin:0; padding:0; height:100%; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size:16px; -webkit-text-size-adjust:100%; text-size-adjust:100%; background: #dbeafe; 
    }
    data-comparison-map { display:block; width:100%; height:100%; }
    
    .global-disclaimer {
      text-align: center; font-size: 0.65rem; color: #64748b; padding: 0 20px 10px; background: transparent; position: relative; z-index: 100;
    }

    .cookie-banner {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1e3a5f; color: #fff; padding: 16px 24px; border-radius: 16px;
      display: flex; gap: 20px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s;
      width: 90%; max-width: 600px;
    }
    .cookie-banner.show { opacity: 1; visibility: visible; bottom: 30px; }
    .cookie-text { font-size: 0.85rem; line-height: 1.4; flex: 1; }
    .cookie-buttons { display: flex; gap: 10px; }
    .btn-cookie { 
      padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 0.8rem;
      font-family: inherit;
    }
    .btn-cookie.accept { background: #34d399; color: #fff; }
    .btn-cookie.decline { background: rgba(255,255,255,0.1); color: #fff; }
    
    @media (max-width: 600px) {
      .cookie-banner { flex-direction: column; text-align: center; }
      .cookie-buttons { width: 100%; }
      .btn-cookie { flex: 1; }
    }
  </style>

  <!-- IMPORTANT: Google Analytics / Google Ads Tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S77KP79EWL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'analytics_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied'
    });
    
    gtag('js', new Date());
    
    // Analytics
    gtag('config', 'G-S77KP79EWL'); 
    
    // SEM POZDĚJI DOPLNÍTE KÓD GOOGLE ADS (AW-...)
    // gtag('config', 'AW-XXXXXXXXX'); 
  </script>

  <script src="data-algo.js"></script>
  <script type="module" src="data-comparison-map.js"></script>
</head>
<body>
  
  <data-comparison-map></data-comparison-map>

  <!-- Disclaimer se automaticky přepne na CZ nebo EN přes JavaScript -->
  <div class="global-disclaimer" id="globalDisclaimer">
    Disclaimer: The predictions, maps, and information on RealWorldView do not constitute financial, investment, or legal advice. Capital is at risk.
  </div>

  <div class="cookie-banner" id="cookieBanner">
    <div class="cookie-text" id="cookieText">
      We use cookies to ensure our website works properly, measure traffic, and for targeted advertising.
    </div>
    <div class="cookie-buttons">
      <button class="btn-cookie decline" id="cookieDecline">Decline</button>
      <button class="btn-cookie accept" id="cookieAccept">Accept All</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Zjistíme jazyk z URL nebo z prohlížeče
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      const browserLang = navigator.language || navigator.userLanguage;
      let isCzech = false;
      if (urlLang === 'cs' || urlLang === 'cz') { isCzech = true; }
      else if (!urlLang && (browserLang.toLowerCase().includes('cs') || browserLang.toLowerCase().includes('sk'))) { isCzech = true; }

      // 2. Přeložíme cookies a disclaimer mimo ShadowDOM
      if (isCzech) {
        document.getElementById('globalDisclaimer').textContent = "Upozornění: Predikce, mapy a informace na platformě RealWorldView nepředstavují finanční, investiční ani právní poradenství. Váš kapitál je vystaven riziku.";
        document.getElementById('cookieText').textContent = "Používáme soubory cookie, abychom zajistili správné fungování našeho webu, měřili návštěvnost a pro cílenou reklamu.";
        document.getElementById('cookieDecline').textContent = "Odmítnout";
        document.getElementById('cookieAccept').textContent = "Přijmout vše";
      }

      // 3. Logika Cookies
      const banner = document.getElementById('cookieBanner');
      if (!localStorage.getItem('rwv_cookie_consent')) {
        setTimeout(() => banner.classList.add('show'), 1500);
      }
      document.getElementById('cookieAccept').addEventListener('click', () => {
        localStorage.setItem('rwv_cookie_consent', 'accepted');
        banner.classList.remove('show');
        gtag('consent', 'update', { 'ad_storage': 'granted', 'analytics_storage': 'granted' });
      });
      document.getElementById('cookieDecline').addEventListener('click', () => {
        localStorage.setItem('rwv_cookie_consent', 'declined');
        banner.classList.remove('show');
      });
    });
  </script>
</body>
</html>
