<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWV Forecasting Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rwv: {
                            bg: '#0B1011',       
                            panel: '#151E20',    
                            border: '#232E30',   
                            lime: '#C6F34F',     
                            limeHover: '#b3db46',
                            textMuted: '#6B8286' 
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'data-flow': 'dataFlow 1.5s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(198,243,79,0.1)' },
                            '50%': { boxShadow: '0 0 25px rgba(198,243,79,0.4)' },
                        },
                        dataFlow: {
                            '0%': { strokeDashoffset: '20' },
                            '100%': { strokeDashoffset: '0' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Sleek custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B1011; }
        ::-webkit-scrollbar-thumb { background: #232E30; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4a4d; }
        
        /* Range Slider Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px; width: 14px;
            border-radius: 50%;
            background: #C6F34F;
            cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 10px rgba(198, 243, 79, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #232E30; border-radius: 2px;
        }

        /* SVG Diagram & Flow Animations */
        .svg-node { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .node-active {
            fill: #151E20 !important;
            stroke: #C6F34F !important;
            filter: drop-shadow(0 0 12px rgba(198,243,79,0.3));
        }
        .node-text-active { fill: #C6F34F !important; }
        
        .svg-path {
            stroke: #232E30;
            stroke-width: 1.5;
            transition: stroke 0.3s ease;
        }
        
        @keyframes dashMove {
            to { stroke-dashoffset: -24; }
        }
        
        .path-active {
            stroke: #C6F34F !important;
            stroke-dasharray: 8 8;
            animation: dashMove 0.8s linear infinite;
        }
    </style>
</head>
<body class="bg-rwv-bg text-gray-200 min-h-screen font-sans selection:bg-rwv-lime selection:text-rwv-bg overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = "https://ivanmazurov--rwv-engine-production-fastapi-app.modal.run"; 
        const COMMODITIES = ["Gold", "Gas", "Brent", "Copper", "Palladium", "Platinum", "Cocoa", "Silver"];

        // Custom Chart.js Plugin for 2-Axis Glowing Crosshair with Fade
        const crosshairGlowPlugin = {
            id: 'crosshairGlow',
            afterDraw: (chart) => {
                if (chart.tooltip?._active?.length) {
                    const activePoint = chart.tooltip._active[0];
                    const ctx = chart.ctx;
                    const x = activePoint.element.x;
                    const y = activePoint.element.y;
                    const topY = chart.scales.y.top;
                    const bottomY = chart.scales.y.bottom;
                    const leftX = chart.scales.x.left;
                    const rightX = chart.scales.x.right;

                    ctx.save();
                    
                    // Create fading gradient for X-axis (Vertical line)
                    const gradY = ctx.createLinearGradient(0, topY, 0, bottomY);
                    gradY.addColorStop(0, 'rgba(198, 243, 79, 0)');
                    gradY.addColorStop(Math.max(0, Math.min(1, (y - topY) / (bottomY - topY))), 'rgba(198, 243, 79, 0.6)');
                    gradY.addColorStop(1, 'rgba(198, 243, 79, 0)');

                    // Create fading gradient for Y-axis (Horizontal line)
                    const gradX = ctx.createLinearGradient(leftX, 0, rightX, 0);
                    gradX.addColorStop(0, 'rgba(198, 243, 79, 0)');
                    gradX.addColorStop(Math.max(0, Math.min(1, (x - leftX) / (rightX - leftX))), 'rgba(198, 243, 79, 0.6)');
                    gradX.addColorStop(1, 'rgba(198, 243, 79, 0)');

                    // Draw Crosshairs
                    ctx.beginPath();
                    ctx.moveTo(x, topY); ctx.lineTo(x, bottomY);
                    ctx.strokeStyle = gradY; ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(leftX, y); ctx.lineTo(rightX, y);
                    ctx.strokeStyle = gradX; ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    // Draw massive glowing point
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#C6F34F'; // Solid inner core
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = 'rgba(198, 243, 79, 0.2)'; // Outer halo
                    ctx.shadowColor = '#C6F34F';
                    ctx.shadowBlur = 20; // Massive glow
                    ctx.stroke();

                    ctx.restore();
                }
            }
        };
        Chart.register(crosshairGlowPlugin);

        // --- DASHBOARD CHART COMPONENT ---
        function ProjectionChart({ data, commodity, isSimulating }) {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            // Initialize or smoothly update the chart
            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const labels = data.map(d => `+${d.day}d`);
                const prices = data.map(d => d.price);

                if (!chartInstanceRef.current) {
                    // 1. Initial Chart Creation
                    const ctx = canvasRef.current.getContext('2d');
                    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                    gradient.addColorStop(0, 'rgba(198, 243, 79, 0.3)'); 
                    gradient.addColorStop(1, 'rgba(198, 243, 79, 0)');

                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: `${commodity} Forecast`,
                                data: prices,
                                borderColor: '#C6F34F',
                                backgroundColor: gradient,
                                borderWidth: 2,
                                tension: 0.4, 
                                pointRadius: 0, 
                                pointHoverRadius: 0, // Handled by custom plugin
                                fill: true,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 600, easing: 'easeOutQuart' },
                            interaction: { intersect: false, mode: 'index' },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: '#151E20', titleColor: '#6B8286',
                                    bodyColor: '#C6F34F', borderColor: '#232E30',
                                    borderWidth: 1, padding: 12, displayColors: false,
                                    animation: { duration: 150 } // Smooth tooltip tracking
                                }
                            },
                            scales: {
                                x: { ticks: { color: '#6B8286', font: { size: 11 } }, grid: { display: false } },
                                y: { ticks: { color: '#6B8286', font: { size: 11 } }, grid: { color: '#232E30', borderDash: [5, 5], drawBorder: false } }
                            }
                        }
                    });
                } else {
                    // 2. Smooth update (morphs existing points to new points)
                    chartInstanceRef.current.data.labels = labels;
                    chartInstanceRef.current.data.datasets[0].data = prices;
                    chartInstanceRef.current.update(); // Triggers the smooth snake-like glide
                }
            }, [data, commodity]);

            // Cleanup on unmount only
            useEffect(() => {
                return () => {
                    if (chartInstanceRef.current) chartInstanceRef.current.destroy();
                }
            }, []);

            return (
                <div className="relative w-full h-[500px] bg-rwv-panel p-6 rounded-2xl border border-rwv-border shadow-2xl flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-4 z-10">
                        <h3 className="text-lg font-bold text-white tracking-wide">Monte Carlo Trajectory</h3>
                        
                        {/* Sleek inline loading indicator instead of overlay */}
                        <div className="h-6 flex items-center">
                            {isSimulating ? (
                                <span className="text-rwv-lime font-mono text-xs font-bold animate-pulse tracking-widest border border-rwv-lime/30 bg-rwv-lime/10 px-3 py-1 rounded-md shadow-[0_0_10px_rgba(198,243,79,0.2)]">
                                    [ RECALCULATING ]
                                </span>
                            ) : (
                                <span className="text-xs text-rwv-textMuted flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-rwv-lime shadow-[0_0_8px_#C6F34F]"></div>
                                    Synchronized
                                </span>
                            )}
                        </div>
                    </div>
                    
                    <div className="relative flex-1 w-full">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

        // --- MATH ENGINE SVG SIMULATION DIAGRAM ---
        function MathSimulationTab() {
            const [phase, setPhase] = useState(0); 

            useEffect(() => {
                let timer;
                if (phase > 0 && phase < 9) {
                    timer = setTimeout(() => {
                        setPhase(p => p + 1);
                    }, 4000); // Progress every 4 seconds
                } else if (phase === 9) {
                    timer = setTimeout(() => {
                        setPhase(0); // Reset after showing output
                    }, 7000); // Hold longer on final output
                }
                return () => clearTimeout(timer);
            }, [phase]);

            const triggerPlay = () => {
                if (phase === 0) setPhase(1);
                else setPhase(0);
            };

            // Deep Architectural Nodes Mapping[cite: 5]
            const nodes = {
                // Phase 1: Raw Sources
                wb: { x: 10, y: 30, label: "World Bank API", phase: 1 },
                fred: { x: 10, y: 100, label: "FRED Macros", phase: 1 },
                meteo: { x: 10, y: 170, label: "Open-Meteo", phase: 1 },
                eia: { x: 10, y: 240, label: "EIA Physicals", phase: 1 },
                yf: { x: 10, y: 310, label: "yfinance (Spreads)", phase: 1 },
                fut: { x: 10, y: 380, label: "Futures Expirations", phase: 1 },

                // Phase 2: Sub-Component Formulas
                l_it: { x: 170, y: 30, label: "Base Econ L(it)", phase: 2 },
                f_it: { x: 170, y: 100, label: "Volatile Econ F(it)", phase: 2 },
                v_t: { x: 170, y: 170, label: "Fund. Risk V(t)", phase: 2 },
                f_r: { x: 170, y: 240, label: "Fin. Stress F(r)", phase: 2 },
                lam: { x: 170, y: 310, label: "Deficit Int. Λ(it)", phase: 2 },
                buf: { x: 170, y: 380, label: "Adapt. Buffer B(it)", phase: 2 },

                // Phase 3: Core Indices
                A: { x: 330, y: 65, label: "Activity Index (A)", phase: 3 },
                R: { x: 330, y: 205, label: "System Risk (R)", phase: 3 },
                D: { x: 330, y: 345, label: "Deficit Index (D)", phase: 3 },

                // Phase 4: Regimes & Modifiers
                madr: { x: 490, y: 65, label: "MADR (a, d, r)", phase: 4 },
                regime: { x: 490, y: 160, label: "Markov Regime z(t)", phase: 4 },
                shock: { x: 490, y: 255, label: "Shock Index Q(t)", phase: 4 },
                season: { x: 490, y: 350, label: "Seasonality S(t)", phase: 4 },

                // Phase 5: Equilibrium Targets
                M_target: { x: 650, y: 65, label: "Base Target M(it)", phase: 5 },
                y_carry: { x: 650, y: 255, label: "Carry Cost c(it)", phase: 5 },

                // Phase 6: SDE Layers
                dm_base: { x: 810, y: 65, label: "Base SDE dm(t)", phase: 6 },
                dx_mkt: { x: 810, y: 160, label: "Market SDE dx(t)", phase: 6 },

                // Phase 7: Kalman & Market Curves
                kalman: { x: 970, y: 110, label: "Kalman Filter P(str)", phase: 7 },
                f_mkt: { x: 970, y: 230, label: "Market Curve f(mkt)", phase: 7 },
                rp: { x: 970, y: 310, label: "Risk Premium RP", phase: 7 },

                // Phase 8: Weighting & Interpolation
                alpha: { x: 1130, y: 170, label: "Struct. Weight (α)", phase: 8 },
                omega: { x: 1130, y: 270, label: "Time Interpolation (ω)", phase: 8 },

                // Phase 9: Final Output
                curve: { x: 1290, y: 220, label: "27-Step Curve", phase: 9 }
            };

            const connections = [
                // Phase 2 
                { from: 'wb', to: 'l_it', reqPhase: 2 }, { from: 'wb', to: 'v_t', reqPhase: 2 },
                { from: 'fred', to: 'f_it', reqPhase: 2 }, { from: 'fred', to: 'f_r', reqPhase: 2 }, { from: 'fred', to: 'lam', reqPhase: 2 },
                { from: 'meteo', to: 'lam', reqPhase: 2 }, { from: 'eia', to: 'lam', reqPhase: 2 }, { from: 'eia', to: 'buf', reqPhase: 2 },
                { from: 'yf', to: 'lam', reqPhase: 2 },
                // Phase 3 
                { from: 'l_it', to: 'A', reqPhase: 3 }, { from: 'f_it', to: 'A', reqPhase: 3 },
                { from: 'v_t', to: 'R', reqPhase: 3 }, { from: 'f_r', to: 'R', reqPhase: 3 },
                { from: 'lam', to: 'D', reqPhase: 3 }, { from: 'buf', to: 'D', reqPhase: 3 },
                // Phase 4 
                { from: 'A', to: 'madr', reqPhase: 4 }, { from: 'R', to: 'madr', reqPhase: 4 }, { from: 'D', to: 'madr', reqPhase: 4 },
                { from: 'A', to: 'regime', reqPhase: 4 }, { from: 'R', to: 'regime', reqPhase: 4 }, { from: 'D', to: 'regime', reqPhase: 4 },
                { from: 'D', to: 'shock', reqPhase: 4 }, { from: 'D', to: 'season', reqPhase: 4 }, 
                // Phase 5 
                { from: 'madr', to: 'M_target', reqPhase: 5 }, { from: 'regime', to: 'M_target', reqPhase: 5 },
                { from: 'D', to: 'y_carry', reqPhase: 5 }, { from: 'regime', to: 'y_carry', reqPhase: 5 },
                // Phase 6 
                { from: 'M_target', to: 'dm_base', reqPhase: 6 },
                { from: 'madr', to: 'dx_mkt', reqPhase: 6 }, { from: 'regime', to: 'dx_mkt', reqPhase: 6 }, 
                { from: 'shock', to: 'dx_mkt', reqPhase: 6 }, { from: 'season', to: 'dx_mkt', reqPhase: 6 },
                // Phase 7
                { from: 'dm_base', to: 'kalman', reqPhase: 7 }, { from: 'dx_mkt', to: 'kalman', reqPhase: 7 },
                { from: 'fut', to: 'f_mkt', reqPhase: 7 }, { from: 'y_carry', to: 'f_mkt', reqPhase: 7 },
                // Phase 8
                { from: 'kalman', to: 'alpha', reqPhase: 8 }, { from: 'f_mkt', to: 'alpha', reqPhase: 8 }, { from: 'rp', to: 'alpha', reqPhase: 8 },
                { from: 'alpha', to: 'omega', reqPhase: 8 },
                // Phase 9
                { from: 'omega', to: 'curve', reqPhase: 9 }
            ];

            const renderPath = (conn, i) => {
                const n1 = nodes[conn.from]; const n2 = nodes[conn.to];
                const startX = n1.x + 130; const startY = n1.y + 20; 
                const endX = n2.x; const endY = n2.y + 20;
                const cp1X = startX + (endX - startX) / 2;
                
                const pathD = `M ${startX} ${startY} C ${cp1X} ${startY}, ${cp1X} ${endY}, ${endX} ${endY}`;
                const isActive = phase >= conn.reqPhase;

                return (
                    <path key={i} d={pathD} fill="none"
                        className={`svg-path ${isActive ? 'path-active' : ''}`} 
                    />
                );
            };

            const panelData = [
                { title: "SYSTEM IDLE", desc: "Awaiting mathematical engine start command.", metrics: [] },
                { title: "STAGE 1: GLOBAL DATA INGESTION", desc: "Fetching macro streams, physicals, spatial spreads, and expiration futures.", metrics: [{label: "Global GDP", val: "+2.1%"}, {label: "Core CPI", val: "3.4%"}, {label: "Spread bz-wti", val: "1.4"}, {label: "Fut. Exps.", val: "N=4"}] },
                { title: "STAGE 2: SUB-COMPONENT PARTITIONS", desc: "Splitting indicators into Volatile F(it) and Base L(it) bounds. Evaluating Deficit Intensity Λ(it).", metrics: [{label: "Volatile F(it)", val: "0.62"}, {label: "Base L(it)", val: "0.55"}, {label: "Deficit Int. (Λ)", val: "1.44"}, {label: "Buffer B(it)", val: "0.72"}] },
                { title: "STAGE 3: CORE MACRO INDICES", desc: "Synthesizing normalized matrices A(it), D(it), and R(it) via hyperbolic tangents.", metrics: [{label: "Activity (A)", val: "0.58"}, {label: "Deficit (D)", val: "0.74"}, {label: "Systemic Risk (R)", val: "0.39"}] },
                { title: "STAGE 4: MADR & MARKOV REGIMES", desc: "Centering parameters (a, d, r). Resolving transition probabilities π(k,t) to classify the active Markov state z(t).", metrics: [{label: "Centered (a,d,r)", val: "[.16, .48, -.22]"}, {label: "Probs (π)", val: "[.1, .2, .6, .1]"}, {label: "Active Regime", val: "State 3"}] },
                { title: "STAGE 5: TARGETS & CARRY", desc: "Calculating long-term Equilibrium Price Target M(it). Compiling Convenience Yield y(it) and Cost of Carry c(carry).", metrics: [{label: "Target Base M(it)", val: "4.12"}, {label: "Yield y(it)", val: "3.2%"}, {label: "Carry c(carry)", val: "0.08"}] },
                { title: "STAGE 6: SDE MONTE CARLO", desc: "Injecting variables into Stochastic Differential Equations. Calculating Base (dm) and Market (dx) drifts.", metrics: [{label: "Base Drift (dm)", val: "+0.012"}, {label: "Mkt Drift (dx)", val: "-0.004"}, {label: "Paths (N)", val: "10,000"}] },
                { title: "STAGE 7: KALMAN & MARKET CURVE", desc: "Applying Kalman filter to yield Structural Price P(str). Optimizing Market Curve f(mkt) integrating Cost of Carry.", metrics: [{label: "State X(plus)", val: "[4.3, 0.1]"}, {label: "Struct P(str)", val: "83.15"}, {label: "Curve f(mkt)", val: "81.90"}] },
                { title: "STAGE 8: WEIGHTING & INTERPOLATION", desc: "Weighing P(str) vs f(mkt) using Uncertainty Weight (α). Interpolating exact expiration dates using Distance Coef (ω).", metrics: [{label: "Uncertainty (α)", val: "0.68"}, {label: "Risk Prem. (RP)", val: "-0.40"}, {label: "Interpolation (ω)", val: "0.85"}] },
                { title: "STAGE 9: OUTPUT CRYSTALLIZATION", desc: "Aggregating the probability-weighted paths into the definitive 27-step forward curve.", metrics: [{label: "T_1 (15d)", val: "$82.10"}, {label: "T_2 (30d)", val: "$82.45"}, {label: "T_3 (45d)", val: "$82.60"}, {label: "T_27 (3yr)", val: "$91.20"}] }
            ];

            return (
                <div className="flex-1 flex flex-col h-full overflow-hidden bg-rwv-bg">
                    <div className="flex-1 bg-rwv-panel m-6 mb-0 rounded-t-2xl border border-rwv-border p-6 flex flex-col relative shadow-2xl overflow-hidden">
                        <div className="flex justify-between items-center mb-6 shrink-0 z-10">
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-tight">Mathematical Architecture Flow</h2>
                                <p className="text-rwv-textMuted text-sm mt-1">Real-time data telemetry through the formula pipeline</p>
                            </div>
                            <button 
                                onClick={triggerPlay}
                                className={`px-6 py-2.5 rounded-lg font-bold text-xs uppercase tracking-widest transition-all ${phase > 0 ? 'bg-red-500/20 text-red-500 border border-red-500/50 hover:bg-red-500/30' : 'bg-rwv-lime text-rwv-bg hover:bg-rwv-limeHover shadow-[0_0_15px_rgba(198,243,79,0.3)]'}`}
                            >
                                {phase > 0 ? "HALT TELEMETRY" : "▶ START TELEMETRY"}
                            </button>
                        </div>
                        <div className="flex-1 w-full relative overflow-auto custom-scrollbar">
                            <div className="min-w-[1450px] min-h-[440px] w-full h-full relative">
                                <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1450 440" preserveAspectRatio="xMidYMid meet">
                                    {connections.map((c, i) => renderPath(c, i))}
                                    {Object.entries(nodes).map(([key, n]) => {
                                        const isActive = phase >= n.phase;
                                        return (
                                            <g key={key} transform={`translate(${n.x}, ${n.y})`} className="svg-node">
                                                <rect width="130" height="40" rx="6" className={`fill-[#0B1011] stroke-2 ${isActive ? 'node-active' : 'stroke-rwv-border'}`} />
                                                <text x="65" y="24" textAnchor="middle" className={`text-[10px] font-bold font-sans ${isActive ? 'node-text-active' : 'fill-gray-500'}`}>
                                                    {n.label}
                                                </text>
                                            </g>
                                        );
                                    })}
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div className="h-44 bg-rwv-panel border border-t-0 border-rwv-border mx-6 mb-6 rounded-b-2xl p-6 flex flex-col shrink-0 transition-all duration-300 shadow-2xl">
                        <div className="flex items-center gap-3 mb-2">
                            <div className={`w-2 h-2 rounded-full ${phase > 0 ? 'bg-rwv-lime animate-pulse shadow-[0_0_8px_#C6F34F]' : 'bg-gray-600'}`}></div>
                            <h3 className="text-rwv-lime font-mono text-sm font-bold tracking-widest">{panelData[phase].title}</h3>
                        </div>
                        <p className="text-gray-400 text-xs mb-5 font-mono ml-5">{panelData[phase].desc}</p>
                        <div className="flex gap-4 ml-5">
                            {panelData[phase].metrics.map((m, i) => (
                                <div key={i} className="bg-rwv-bg border border-rwv-border rounded-lg p-3 min-w-[170px] flex flex-col justify-center transition-all duration-500 hover:border-rwv-lime/50 hover:bg-rwv-lime/5">
                                    <div className="text-rwv-textMuted text-[10px] uppercase font-bold tracking-wider mb-1">{m.label}</div>
                                    <div className="text-white font-mono text-sm tracking-wide">{m.val}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PHASE 3 ADDONS (LOCKED) ---
        function Phase3LockedFeatures() {
            const features = ["Factor Attribution", "Probability Curves", "Index Momentum"];
            return (
                <div className="mt-6 bg-rwv-panel rounded-2xl border border-rwv-border p-5">
                    <div className="flex items-center justify-between mb-4">
                        <h4 className="text-sm font-bold text-gray-300">Advanced Analytics (Phase 3)</h4>
                        <span className="text-xs bg-rwv-border text-rwv-textMuted px-2 py-1 rounded-md uppercase tracking-wider font-bold">Upcoming</span>
                    </div>
                    <div className="flex flex-wrap gap-4">
                        {features.map((feature, idx) => (
                            <div key={idx} className="flex items-center gap-3 bg-rwv-bg px-4 py-3 rounded-xl border border-rwv-border opacity-50 cursor-not-allowed select-none transition hover:opacity-70">
                                <div className="w-9 h-5 bg-rwv-border rounded-full relative">
                                    <div className="w-3 h-3 bg-rwv-textMuted rounded-full absolute left-1 top-1"></div>
                                </div>
                                <span className="text-sm text-gray-400 font-medium">{feature}</span>
                                <span className="ml-auto text-rwv-textMuted text-xs">🔒</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- HEALTH WIDGET COMPONENT ---
        function DataHealthWidget({ healthData }) {
            const [isOpen, setIsOpen] = useState(false);
            if (!healthData) return null;

            return (
                <div className="fixed bottom-6 right-6 z-50 w-80 bg-rwv-panel border border-rwv-border rounded-xl shadow-2xl transition-all duration-300">
                    <div 
                        className="p-4 flex justify-between items-center cursor-pointer rounded-t-xl hover:bg-rwv-border/50 transition"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <h3 className="font-bold text-sm text-gray-200">Data Pipeline Status</h3>
                        </div>
                        <span className="text-rwv-textMuted text-xs">{isOpen ? '▼' : '▲'}</span>
                    </div>
                    
                    {isOpen && (
                        <div className="p-4 max-h-80 overflow-y-auto custom-scrollbar bg-rwv-bg rounded-b-xl border-t border-rwv-border">
                            {Object.entries(healthData).map(([category, metrics]) => (
                                <div key={category} className="mb-4 last:mb-0">
                                    <h4 className="text-[10px] font-bold uppercase text-rwv-textMuted mb-2 tracking-widest border-b border-rwv-border pb-1">
                                        {category.replace('_', ' ')}
                                    </h4>
                                    <ul className="space-y-1.5">
                                        {Object.entries(metrics).map(([key, info]) => (
                                            <li key={key} className="flex justify-between items-center text-xs">
                                                <span className="text-gray-400 truncate w-32">{key.replace('_', ' ')}</span>
                                                <span className={`font-mono text-[10px] px-1.5 py-0.5 rounded ${info.status.includes('OK') ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'}`}>
                                                    {info.status}
                                                </span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [viewTab, setViewTab] = useState('dashboard'); // 'dashboard', 'simulation', or 'debug'
            const [selectedCommodity, setSelectedCommodity] = useState("Brent");
            const [defaultPredictions, setDefaultPredictions] = useState(null);
            const [chartData, setChartData] = useState([]);
            const [healthData, setHealthData] = useState(null);
            
            const [sliders, setSliders] = useState({ A_it: 0.5, D_it: 0.5, R_it: 0.5 });
            const [isSimulating, setIsSimulating] = useState(false);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                Promise.all([
                    fetch(`${API_BASE}/api/v1/predict`).then(res => res.json()),
                    fetch(`${API_BASE}/api/v1/data-status`).then(res => res.json())
                ])
                .then(([predictRes, healthRes]) => {
                    if (predictRes.status === "success" && predictRes.data) {
                        setDefaultPredictions(predictRes.data);
                        setHealthData(healthRes.indices);
                    } else {
                        setError("Engine cache pending. Please trigger calculations.");
                    }
                    setLoading(false);
                })
                .catch(err => {
                    setError("Failed to connect to RWV API.");
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (defaultPredictions && defaultPredictions[selectedCommodity]) {
                    const data = defaultPredictions[selectedCommodity];
                    setSliders({ A_it: data.indices.A, D_it: data.indices.D, R_it: data.indices.R });
                    setChartData(data.projection_curve);
                }
            }, [selectedCommodity, defaultPredictions]);

            useEffect(() => {
                if (!defaultPredictions) return;
                const timer = setTimeout(() => {
                    setIsSimulating(true);
                    fetch(`${API_BASE}/api/v1/simulate-custom`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            commodity: selectedCommodity,
                            A_it: parseFloat(sliders.A_it),
                            D_it: parseFloat(sliders.D_it),
                            R_it: parseFloat(sliders.R_it)
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") { setChartData(data.projection_curve); }
                        setIsSimulating(false);
                    })
                    .catch(err => {
                        console.error("Simulation failed", err);
                        setIsSimulating(false);
                    });
                }, 400); 

                return () => clearTimeout(timer);
            }, [sliders, selectedCommodity]);

            const handleSliderChange = (e, key) => {
                setSliders(prev => ({ ...prev, [key]: parseFloat(e.target.value) }));
            };

            if (loading) return <div className="flex items-center justify-center min-h-screen text-rwv-lime text-xl font-mono animate-pulse">INITIALIZING TERMINAL...</div>;
            if (error) return <div className="flex items-center justify-center min-h-screen text-red-500 font-mono">{error}</div>;

            const spotPrice = defaultPredictions?.[selectedCommodity]?.spot_price || 0.00;

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    
                    {/* Top Global Navigation Bar */}
                    <div className="h-16 bg-rwv-panel border-b border-rwv-border flex items-center justify-between px-6 shrink-0 z-30">
                        <div className="flex items-center gap-4">
                            <div className="w-8 h-8 bg-rwv-lime rounded flex items-center justify-center shadow-[0_0_15px_rgba(198,243,79,0.3)]">
                                <span className="text-rwv-bg font-black text-xl">R</span>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-white tracking-tight leading-none">REALWORLDVIEW</h1>
                                <p className="text-[10px] text-rwv-lime tracking-widest uppercase mt-0.5">Mathematical Engine</p>
                            </div>
                        </div>
                        
                        <div className="flex gap-2 bg-rwv-bg p-1 rounded-lg border border-rwv-border">
                            <button 
                                onClick={() => setViewTab('dashboard')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'dashboard' ? 'bg-rwv-panel text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                Output Matrix
                            </button>
                            <button 
                                onClick={() => setViewTab('simulation')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'simulation' ? 'bg-rwv-panel text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                Math Pipeline
                            </button>
                            <button 
                                onClick={() => setViewTab('debug')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'debug' ? 'bg-rwv-panel text-yellow-400 shadow border border-yellow-400/20' : 'text-gray-500 hover:text-yellow-400/70'}`}
                            >
                                Debug (Dev)
                            </button>
                        </div>
                    </div>

                    {/* Main Workspace Split */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* Persistent Sidebar (Only in Dashboard mode) */}
                        {viewTab === 'dashboard' && (
                            <div className="w-[340px] bg-rwv-panel border-r border-rwv-border flex flex-col shadow-xl z-20 shrink-0">
                                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar flex flex-col gap-8">
                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-3">Target Asset</h2>
                                        <div className="grid grid-cols-2 gap-2">
                                            {COMMODITIES.map(c => (
                                                <button
                                                    key={c}
                                                    onClick={() => setSelectedCommodity(c)}
                                                    className={`w-full text-center px-2 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 border ${
                                                        selectedCommodity === c 
                                                        ? 'bg-gradient-to-br from-rwv-lime to-[#9abf3b] text-rwv-bg border-transparent shadow-[0_0_15px_rgba(198,243,79,0.3)]' 
                                                        : 'bg-rwv-bg text-gray-400 border-rwv-border hover:border-rwv-textMuted hover:text-white'
                                                    }`}
                                                >
                                                    {c}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <hr className="border-rwv-border" />

                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-4">Live Parameter Tuning</h2>
                                        <div className="flex flex-col gap-6">
                                            <SidebarSlider title="Economic Activity (A_it)" value={sliders.A_it} onChange={(e) => handleSliderChange(e, 'A_it')} />
                                            <SidebarSlider title="Deficit Intensity (D_it)" value={sliders.D_it} onChange={(e) => handleSliderChange(e, 'D_it')} />
                                            <SidebarSlider title="Systemic Risk (R_it)" value={sliders.R_it} onChange={(e) => handleSliderChange(e, 'R_it')} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Dynamic Main View */}
                        {viewTab === 'dashboard' ? (
                            <div className="flex-1 p-8 overflow-y-auto flex flex-col relative bg-rwv-bg">
                                <header className="flex justify-between items-end mb-6">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="text-rwv-textMuted text-sm font-medium">Market /</span>
                                            <span className="text-rwv-lime text-sm font-bold uppercase tracking-wider">{selectedCommodity}</span>
                                        </div>
                                        <h2 className="text-4xl font-bold text-white tracking-tight">{selectedCommodity} <span className="text-gray-500 font-light">/ USD</span></h2>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xs text-rwv-textMuted uppercase tracking-widest mb-1">Spot Anchor</p>
                                        <p className="text-4xl font-mono font-bold text-white">${spotPrice.toFixed(2)}</p>
                                    </div>
                                </header>
                                <ProjectionChart data={chartData} commodity={selectedCommodity} isSimulating={isSimulating} />
                                <Phase3LockedFeatures />
                            </div>
                        ) : viewTab === 'simulation' ? (
                            <MathSimulationTab />
                        ) : (
                            // The Debug/Dev Tab
                            <div className="flex-1 p-10 overflow-y-auto bg-rwv-bg font-mono">
                                <div className="max-w-3xl mx-auto">
                                    <h2 className="text-3xl font-bold text-yellow-400 mb-2 border-b border-yellow-400/20 pb-4">Dev Debug Output</h2>
                                    <div className="mb-8 mt-6">
                                        <span className="text-rwv-textMuted uppercase tracking-widest text-xs">Active Commodity Stream</span>
                                        <div className="text-2xl text-white mt-1">{selectedCommodity} / USD</div>
                                    </div>
                                    <div className="bg-rwv-panel p-6 rounded-xl border border-rwv-border shadow-xl">
                                        <h3 className="text-gray-300 text-sm font-bold mb-4 uppercase tracking-wider">Raw 27-Step Projection Array</h3>
                                        {chartData.length > 0 ? (
                                            <ul className="space-y-2 text-sm">
                                                {chartData.map((d, i) => (
                                                    <li key={i} className="flex justify-between border-b border-rwv-border/50 pb-1 hover:bg-rwv-border/30 px-2 rounded transition">
                                                        <span className="text-gray-500">Step {i+1} <span className="text-gray-600">({d.day} days out)</span></span>
                                                        <span className="text-green-400 font-bold">${d.price.toFixed(2)}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        ) : (
                                            <span className="text-red-400">Array empty. No data calculated.</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        <DataHealthWidget healthData={healthData} />
                    </div>
                </div>
            );
        }

        // --- SIDEBAR SLIDER COMPONENT ---
        function SidebarSlider({ title, value, onChange }) {
            return (
                <div className="flex flex-col">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-semibold text-gray-300">{title}</label>
                        <span className="font-mono text-xs font-bold text-rwv-lime bg-rwv-lime/10 px-2 py-0.5 rounded border border-rwv-lime/20 shadow-[0_0_5px_rgba(198,243,79,0.2)]">
                            {value.toFixed(2)}
                        </span>
                    </div>
                    <input type="range" min="0.00" max="1.00" step="0.01" value={value} onChange={onChange} />
                    <div className="flex justify-between text-[10px] text-rwv-textMuted mt-1.5 font-mono">
                        <span>0.00</span>
                        <span>1.00</span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
