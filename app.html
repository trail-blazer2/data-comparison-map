<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWV Math Engine Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration: Point this to your Modal API or local FastAPI server
        const API_BASE = "http://127.0.0.1:8000"; 
        
        const COMMODITIES = ["Gold", "Gas", "Brent", "Copper", "Palladium", "Platinum", "Cocoa", "Silver"];

        // --- CHART COMPONENT ---
        function ProjectionChart({ data, commodity, isSimulating }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;
                
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                const labels = data.map(d => `+${d.day}d`);
                const prices = data.map(d => d.price);

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: `${commodity} Projected Price`,
                            data: prices,
                            borderColor: 'rgba(59, 130, 246, 1)', // Tailwind Blue-500
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                            fill: true,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 400 },
                        plugins: {
                            legend: { labels: { color: '#e5e7eb' } }
                        },
                        scales: {
                            x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
                            y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) chartRef.current.destroy();
                }
            }, [data, commodity]);

            return (
                <div className="relative w-full h-96 bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg">
                    {isSimulating && (
                        <div className="absolute inset-0 bg-gray-900/50 flex items-center justify-center rounded-xl z-10 transition-opacity">
                            <span className="text-blue-400 font-semibold animate-pulse">Running Monte Carlo...</span>
                        </div>
                    )}
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        }

        // --- HEALTH WIDGET COMPONENT ---
        function DataHealthWidget({ healthData }) {
            const [isOpen, setIsOpen] = useState(false);

            if (!healthData) return null;

            return (
                <div className="fixed bottom-6 right-6 z-50 w-80 bg-gray-800 border border-gray-600 rounded-xl shadow-2xl transition-all duration-300">
                    <div 
                        className="p-4 bg-gray-700 flex justify-between items-center cursor-pointer rounded-t-xl hover:bg-gray-600 transition"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <div className="flex items-center gap-2">
                            <span className="text-lg">📡</span>
                            <h3 className="font-bold text-sm text-gray-100">Data Pipeline Health</h3>
                        </div>
                        <span className="text-gray-300">{isOpen ? '▼' : '▲'}</span>
                    </div>
                    
                    {isOpen && (
                        <div className="p-4 max-h-96 overflow-y-auto custom-scrollbar bg-gray-900 rounded-b-xl border-t border-gray-600">
                            {Object.entries(healthData).map(([category, metrics]) => (
                                <div key={category} className="mb-5 last:mb-0">
                                    <h4 className="text-xs font-bold uppercase text-gray-400 mb-2 border-b border-gray-700 pb-1">
                                        {category.replace('_', ' ')}
                                    </h4>
                                    <ul className="space-y-1.5">
                                        {Object.entries(metrics).map(([key, info]) => (
                                            <li key={key} className="flex justify-between items-center text-sm">
                                                <span className="text-gray-300 truncate w-32" title={key}>
                                                    {key.replace('_', ' ')}
                                                </span>
                                                <span className={`font-mono text-xs px-2 py-0.5 rounded ${info.status.includes('OK') ? 'bg-green-900/40 text-green-400' : 'bg-yellow-900/40 text-yellow-400'}`}>
                                                    {info.status}
                                                </span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [selectedCommodity, setSelectedCommodity] = useState("Brent");
            const [defaultPredictions, setDefaultPredictions] = useState(null);
            const [chartData, setChartData] = useState([]);
            const [healthData, setHealthData] = useState(null);
            
            const [sliders, setSliders] = useState({ A_it: 0.5, D_it: 0.5, R_it: 0.5 });
            const [isSimulating, setIsSimulating] = useState(false);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Fetch default engine cache and system health
            useEffect(() => {
                Promise.all([
                    fetch(`${API_BASE}/api/v1/predict`).then(res => res.json()),
                    fetch(`${API_BASE}/api/v1/data-status`).then(res => res.json())
                ])
                .then(([predictRes, healthRes]) => {
                    if (predictRes.status === "success" && predictRes.data) {
                        setDefaultPredictions(predictRes.data);
                        setHealthData(healthRes.indices);
                    } else {
                        setError("Engine cache pending. Trigger processing on backend.");
                    }
                    setLoading(false);
                })
                .catch(err => {
                    setError("Failed to connect to RWV API.");
                    setLoading(false);
                });
            }, []);

            // Handle commodity switch
            useEffect(() => {
                if (defaultPredictions && defaultPredictions[selectedCommodity]) {
                    const data = defaultPredictions[selectedCommodity];
                    setSliders({
                        A_it: data.indices.A,
                        D_it: data.indices.D,
                        R_it: data.indices.R,
                    });
                    setChartData(data.projection_curve);
                }
            }, [selectedCommodity, defaultPredictions]);

            // Debounce Custom Simulation on Slider Drag
            useEffect(() => {
                if (!defaultPredictions) return;

                const timer = setTimeout(() => {
                    setIsSimulating(true);
                    
                    fetch(`${API_BASE}/api/v1/simulate-custom`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            commodity: selectedCommodity,
                            A_it: parseFloat(sliders.A_it),
                            D_it: parseFloat(sliders.D_it),
                            R_it: parseFloat(sliders.R_it)
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            setChartData(data.projection_curve);
                        }
                        setIsSimulating(false);
                    })
                    .catch(err => {
                        console.error("Simulation failed", err);
                        setIsSimulating(false);
                    });
                }, 500); // 500ms debounce

                return () => clearTimeout(timer);
            }, [sliders, selectedCommodity]);

            const handleSliderChange = (e, key) => {
                setSliders(prev => ({ ...prev, [key]: parseFloat(e.target.value) }));
            };

            if (loading) return <div className="flex items-center justify-center min-h-screen text-2xl font-bold">Initializing RWV Engine...</div>;
            if (error) return <div className="flex items-center justify-center min-h-screen text-red-500 font-bold">{error}</div>;

            const spotPrice = defaultPredictions?.[selectedCommodity]?.spot_price || 0.00;

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar Nav */}
                    <div className="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
                        <div className="p-6 border-b border-gray-700">
                            <h1 className="text-xl font-black text-blue-400 tracking-tight">REALWORLDVIEW</h1>
                            <p className="text-xs text-gray-400 mt-1">Mathematical Forecasting</p>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-2">
                            <h2 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Commodities</h2>
                            {COMMODITIES.map(c => (
                                <button
                                    key={c}
                                    onClick={() => setSelectedCommodity(c)}
                                    className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-all ${
                                        selectedCommodity === c 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-gray-400 hover:bg-gray-700 hover:text-gray-200'
                                    }`}
                                >
                                    {c}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content Pane */}
                    <div className="flex-1 p-8 overflow-y-auto">
                        <header className="flex justify-between items-end mb-8 border-b border-gray-700 pb-4">
                            <div>
                                <h2 className="text-3xl font-bold text-white">{selectedCommodity} Futures</h2>
                                <p className="text-sm text-gray-400 mt-1">27-Step Monte Carlo Valuation Curve</p>
                            </div>
                            <div className="text-right">
                                <p className="text-xs text-gray-400 uppercase tracking-wide">Live Spot Price</p>
                                <p className="text-3xl font-mono font-bold text-green-400">${spotPrice.toFixed(2)}</p>
                            </div>
                        </header>

                        {/* Interactive Sliders (A, D, R) */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <SliderCard 
                                title="Economic Activity (A_it)" 
                                value={sliders.A_it} 
                                onChange={(e) => handleSliderChange(e, 'A_it')} 
                                color="blue"
                            />
                            <SliderCard 
                                title="Deficit Intensity (D_it)" 
                                value={sliders.D_it} 
                                onChange={(e) => handleSliderChange(e, 'D_it')} 
                                color="red"
                            />
                            <SliderCard 
                                title="Systemic Risk (R_it)" 
                                value={sliders.R_it} 
                                onChange={(e) => handleSliderChange(e, 'R_it')} 
                                color="purple"
                            />
                        </div>

                        {/* Chart Render */}
                        <ProjectionChart data={chartData} commodity={selectedCommodity} isSimulating={isSimulating} />
                    </div>

                    {/* API Diagnostic Health Status */}
                    <DataHealthWidget healthData={healthData} />
                </div>
            );
        }

        function SliderCard({ title, value, onChange, color }) {
            const colors = {
                blue: 'accent-blue-500 text-blue-400',
                red: 'accent-red-500 text-red-400',
                purple: 'accent-purple-500 text-purple-400',
            };
            
            return (
                <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow flex flex-col justify-center">
                    <div className="flex justify-between items-center mb-4">
                        <label className="text-sm font-semibold text-gray-300">{title}</label>
                        <span className={`font-mono font-bold text-lg ${colors[color].split(' ')[1]}`}>
                            {value.toFixed(2)}
                        </span>
                    </div>
                    <input 
                        type="range" 
                        min="0.00" 
                        max="1.00" 
                        step="0.01" 
                        value={value} 
                        onChange={onChange}
                        className={`w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer ${colors[color].split(' ')[0]}`}
                    />
                    <div className="flex justify-between text-xs text-gray-500 mt-2 font-mono">
                        <span>0.00</span>
                        <span>1.00</span>
                    </div>
                </div>
            );
        }

        // Mount App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
