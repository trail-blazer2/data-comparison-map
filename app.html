<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWV Forecasting Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rwv: {
                            bg: '#0B1011',       
                            panel: '#151E20',    
                            border: '#232E30',   
                            lime: '#C6F34F',     
                            limeHover: '#b3db46',
                            textMuted: '#6B8286' 
                        }
                    },
                    animation: {
                        'flow': 'flowData 2s linear infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        flowData: {
                            '0%': { strokeDashoffset: '100' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(198,243,79,0.1)' },
                            '50%': { boxShadow: '0 0 25px rgba(198,243,79,0.4)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- MathJax for rendering LaTeX formulas dynamically -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            startup: { typeset: false } // We will trigger it manually in React
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Sleek custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B1011; }
        ::-webkit-scrollbar-thumb { background: #232E30; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4a4d; }
        
        /* Range Slider Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px; width: 14px;
            border-radius: 50%;
            background: #C6F34F;
            cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 10px rgba(198, 243, 79, 0.4);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #232E30; border-radius: 2px;
        }

        /* Flowing Path Animation for Diagram */
        .path-line {
            stroke-dasharray: 10;
            animation: flowData 1s linear infinite;
        }
    </style>
</head>
<body class="bg-rwv-bg text-gray-200 min-h-screen font-sans selection:bg-rwv-lime selection:text-rwv-bg overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = "https://ivanmazurov--rwv-engine-production-fastapi-app.modal.run"; 
        const COMMODITIES = ["Gold", "Gas", "Brent", "Copper", "Palladium", "Platinum", "Cocoa", "Silver"];

        // Custom Chart.js Plugin for 2-Axis Glowing Crosshair
        const crosshairGlowPlugin = {
            id: 'crosshairGlow',
            afterDraw: (chart) => {
                if (chart.tooltip?._active?.length) {
                    const activePoint = chart.tooltip._active[0];
                    const ctx = chart.ctx;
                    const x = activePoint.element.x;
                    const y = activePoint.element.y;
                    const topY = chart.scales.y.top;
                    const bottomY = chart.scales.y.bottom;
                    const leftX = chart.scales.x.left;
                    const rightX = chart.scales.x.right;

                    ctx.save();
                    
                    // Draw glowing intersecting lines
                    ctx.beginPath();
                    ctx.moveTo(x, topY);
                    ctx.lineTo(x, bottomY);
                    ctx.moveTo(leftX, y);
                    ctx.lineTo(rightX, y);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(198, 243, 79, 0.5)';
                    ctx.shadowColor = 'rgba(198, 243, 79, 0.9)';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    
                    // Draw exact point hollow circle
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#0B1011';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#C6F34F';
                    ctx.stroke();

                    ctx.restore();
                }
            }
        };

        // Register custom plugin
        Chart.register(crosshairGlowPlugin);

        // --- DASHBOARD CHART COMPONENT ---
        function ProjectionChart({ data, commodity, isSimulating }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;
                
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                const labels = data.map(d => `+${d.day}d`);
                const prices = data.map(d => d.price);

                const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, 'rgba(198, 243, 79, 0.3)'); 
                gradient.addColorStop(1, 'rgba(198, 243, 79, 0)');

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: `${commodity} Forecast`,
                            data: prices,
                            borderColor: '#C6F34F',
                            backgroundColor: gradient,
                            borderWidth: 2,
                            tension: 0.4, 
                            pointRadius: 0, 
                            pointHoverRadius: 0, 
                            fill: true,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 400 },
                        interaction: {
                            intersect: false,
                            mode: 'index',
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#151E20',
                                titleColor: '#6B8286',
                                bodyColor: '#C6F34F',
                                borderColor: '#232E30',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: false
                            }
                        },
                        scales: {
                            x: { ticks: { color: '#6B8286', font: { size: 11 } }, grid: { display: false } },
                            y: { ticks: { color: '#6B8286', font: { size: 11 } }, grid: { color: '#232E30', borderDash: [5, 5], drawBorder: false } }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); }
            }, [data, commodity]);

            return (
                <div className="relative w-full h-[500px] bg-rwv-panel p-6 rounded-2xl border border-rwv-border shadow-2xl flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold text-white tracking-wide">Monte Carlo Trajectory</h3>
                        <span className="text-xs text-rwv-textMuted flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-rwv-lime shadow-[0_0_8px_#C6F34F]"></div>
                            Live Simulation
                        </span>
                    </div>
                    
                    <div className="relative flex-1 w-full">
                        {isSimulating && (
                            <div className="absolute inset-0 bg-rwv-panel/70 backdrop-blur-sm flex items-center justify-center rounded-xl z-10 transition-opacity">
                                <span className="text-rwv-lime font-mono text-sm animate-pulse tracking-widest border border-rwv-lime/30 px-4 py-2 rounded-full">
                                    RECALCULATING SDE...
                                </span>
                            </div>
                        )}
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

        // --- MATH ENGINE SIMULATION DIAGRAM COMPONENT ---
        function MathSimulationTab() {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);
            const [logs, setLogs] = useState(["[SYSTEM] Initializing Mathematical Pipeline..."]);
            const containerRef = useRef(null);

            // The pipeline definitions heavily citing the provided document
            const pipeline = [
                {
                    id: 1,
                    title: "Index Normalization",
                    desc: "Ingesting raw metrics into centered indices.",
                    formula: "$$ D_{i,t} = 1 - \\exp\\left[-\\frac{\\Lambda_{D,i,t}}{1 + \\psi_i B_{i,t}}\\right] $$", //[cite: 4]
                    log: "[ENGINE] Calculating Deficit Index (D_it). Applying Market Adaptability buffer (B_it)."
                },
                {
                    id: 2,
                    title: "Regime Probability",
                    desc: "Calculating Structural Market States (1-4).",
                    formula: "$$ \\pi_{k,t} = \\frac{f_k(\\mathbf{y}_t) \\pi_{k,t}^-}{\\sum_\\ell f_\\ell(\\mathbf{y}_t) \\pi_{\\ell,t}^-} $$", //[cite: 4]
                    log: "[ENGINE] Transition Probability applied. Identifying normal vs deficit state."
                },
                {
                    id: 3,
                    title: "Base Target Assembly",
                    desc: "Assembling long-term equilibrium price logarithm.",
                    formula: "$$ M_{i,t} = \\sum_{k=1}^K \\pi_{k,t} M^{(k)}_{i,t} $$", //[cite: 4]
                    log: "[ENGINE] Centering indices (MADR). Assembling Target Price (M_it)."
                },
                {
                    id: 4,
                    title: "Stochastic Diff. Equations",
                    desc: "Running Monte Carlo Base & Market Layers.",
                    formula: "$$ dm_{t} = K_{m}[M(A_t, D_t, R_t) - m_{t}]dt + \\Sigma_{m} dW_{t}^{m} $$", //[cite: 4]
                    log: "[ENGINE] Triggering Geometric Brownian Motion. Applying Kalman Gain external correction."
                },
                {
                    id: 5,
                    title: "Forward Curve Aggregation",
                    desc: "Probability-weighted trajectory mapping.",
                    formula: "$$ \\hat{P}_{i,t}^{fut}(T_\\ell) = \\sum_{s=1}^{N_s} p_s \\tilde{P}_{i,t}^{(s)}(T_\\ell) $$", //[cite: 4]
                    log: "[ENGINE] 27-Step forecast extracted. Injecting convenience yield and carry costs."
                }
            ];

            useEffect(() => {
                if (window.MathJax) {
                    window.MathJax.typesetPromise([containerRef.current]).catch(err => console.log(err));
                }
            }, [currentStep]);

            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setCurrentStep(prev => {
                            const next = prev + 1;
                            if (next > pipeline.length) {
                                setIsPlaying(false);
                                return 0; // reset
                            }
                            if (next > 0 && next <= pipeline.length) {
                                setLogs(l => [...l, pipeline[next-1].log]);
                            }
                            return next;
                        });
                    }, 2500); // Slow motion speed
                }
                return () => clearInterval(interval);
            }, [isPlaying]);

            const triggerPlay = () => {
                if (!isPlaying) {
                    setCurrentStep(0);
                    setLogs(["[SYSTEM] Pipeline execution initiated..."]);
                    setIsPlaying(true);
                } else {
                    setIsPlaying(false);
                }
            };

            return (
                <div ref={containerRef} className="flex-1 flex gap-6 h-full p-8 overflow-hidden">
                    {/* Visual Diagram Area */}
                    <div className="flex-1 bg-rwv-panel rounded-2xl border border-rwv-border p-8 flex flex-col relative shadow-2xl overflow-y-auto custom-scrollbar">
                        <div className="flex justify-between items-center mb-8">
                            <div>
                                <h2 className="text-2xl font-bold text-white">Mathematical Architecture</h2>
                                <p className="text-rwv-textMuted text-sm mt-1">Live visualization of the stochastic simulation pipeline</p>
                            </div>
                            <button 
                                onClick={triggerPlay}
                                className={`px-8 py-3 rounded-lg font-bold text-sm tracking-widest transition-all ${isPlaying ? 'bg-red-500/20 text-red-500 border border-red-500/50 hover:bg-red-500/30' : 'bg-rwv-lime text-rwv-bg hover:bg-rwv-limeHover shadow-[0_0_20px_rgba(198,243,79,0.3)]'}`}
                            >
                                {isPlaying ? "HALT SIMULATION" : "▶ SIMULATE ENGINE"}
                            </button>
                        </div>

                        <div className="relative flex flex-col gap-6 pl-6 mt-4">
                            {/* Connecting vertical line */}
                            <div className="absolute left-[52px] top-4 bottom-12 w-0.5 bg-rwv-border z-0"></div>
                            
                            {pipeline.map((node, idx) => {
                                const isActive = currentStep === node.id;
                                const isPassed = currentStep > node.id;
                                
                                return (
                                    <div key={node.id} className={`relative z-10 flex gap-6 items-start transition-all duration-700 ${isActive ? 'opacity-100 scale-[1.02]' : isPassed ? 'opacity-60' : 'opacity-30 blur-[1px]'}`}>
                                        
                                        {/* Status Node */}
                                        <div className={`w-14 h-14 rounded-full flex items-center justify-center shrink-0 border-2 transition-colors duration-500 ${isActive ? 'bg-rwv-bg border-rwv-lime shadow-[0_0_15px_rgba(198,243,79,0.5)]' : isPassed ? 'bg-rwv-lime border-rwv-lime' : 'bg-rwv-bg border-rwv-border'}`}>
                                            <span className={`font-mono font-bold ${isActive ? 'text-rwv-lime' : isPassed ? 'text-rwv-bg' : 'text-rwv-border'}`}>{node.id}</span>
                                        </div>

                                        {/* Formula Card */}
                                        <div className={`flex-1 p-5 rounded-xl border transition-all duration-500 ${isActive ? 'bg-rwv-bg border-rwv-lime animate-pulse-glow' : 'bg-rwv-bg border-rwv-border'}`}>
                                            <h3 className={`font-bold text-sm mb-1 ${isActive ? 'text-white' : 'text-gray-400'}`}>{node.title}</h3>
                                            <p className="text-xs text-rwv-textMuted mb-4">{node.desc}</p>
                                            <div className="bg-[#080c0d] p-4 rounded-lg border border-[#1a2325] overflow-x-auto custom-scrollbar flex items-center justify-center text-gray-300">
                                                {/* Raw string for MathJax to interpret */}
                                                <span dangerouslySetInnerHTML={{__html: node.formula}} />
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* Terminal Log Output */}
                    <div className="w-[320px] bg-rwv-panel border border-rwv-border rounded-2xl p-5 flex flex-col shadow-2xl">
                        <div className="border-b border-rwv-border pb-3 mb-3 flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-rwv-lime animate-pulse"></div>
                            <h3 className="font-mono text-xs font-bold text-gray-300 uppercase tracking-widest">Engine Diagnostics</h3>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar font-mono text-[10px] text-rwv-textMuted space-y-3">
                            {logs.map((log, i) => (
                                <div key={i} className={`${i === logs.length - 1 ? 'text-rwv-lime' : ''}`}>
                                    <span className="text-gray-600 mr-2">[{new Date().toISOString().split('T')[1].split('.')[0]}]</span>
                                    {log}
                                </div>
                            ))}
                            {isPlaying && (
                                <div className="text-rwv-lime animate-pulse mt-2">_</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }


        // --- PHASE 3 ADDONS (LOCKED) ---
        function Phase3LockedFeatures() {
            const features = ["Factor Attribution", "Probability Curves", "Index Momentum"];
            return (
                <div className="mt-6 bg-rwv-panel rounded-2xl border border-rwv-border p-5">
                    <div className="flex items-center justify-between mb-4">
                        <h4 className="text-sm font-bold text-gray-300">Advanced Analytics (Phase 3)</h4>
                        <span className="text-xs bg-rwv-border text-rwv-textMuted px-2 py-1 rounded-md uppercase tracking-wider font-bold">Upcoming</span>
                    </div>
                    <div className="flex flex-wrap gap-4">
                        {features.map((feature, idx) => (
                            <div key={idx} className="flex items-center gap-3 bg-rwv-bg px-4 py-3 rounded-xl border border-rwv-border opacity-50 cursor-not-allowed select-none transition hover:opacity-70">
                                <div className="w-9 h-5 bg-rwv-border rounded-full relative">
                                    <div className="w-3 h-3 bg-rwv-textMuted rounded-full absolute left-1 top-1"></div>
                                </div>
                                <span className="text-sm text-gray-400 font-medium">{feature}</span>
                                <span className="ml-auto text-rwv-textMuted text-xs">🔒</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- HEALTH WIDGET COMPONENT ---
        function DataHealthWidget({ healthData }) {
            const [isOpen, setIsOpen] = useState(false);
            if (!healthData) return null;

            return (
                <div className="fixed bottom-6 right-6 z-50 w-80 bg-rwv-panel border border-rwv-border rounded-xl shadow-2xl transition-all duration-300">
                    <div 
                        className="p-4 flex justify-between items-center cursor-pointer rounded-t-xl hover:bg-rwv-border/50 transition"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <h3 className="font-bold text-sm text-gray-200">Data Pipeline Status</h3>
                        </div>
                        <span className="text-rwv-textMuted text-xs">{isOpen ? '▼' : '▲'}</span>
                    </div>
                    
                    {isOpen && (
                        <div className="p-4 max-h-80 overflow-y-auto custom-scrollbar bg-rwv-bg rounded-b-xl border-t border-rwv-border">
                            {Object.entries(healthData).map(([category, metrics]) => (
                                <div key={category} className="mb-4 last:mb-0">
                                    <h4 className="text-[10px] font-bold uppercase text-rwv-textMuted mb-2 tracking-widest border-b border-rwv-border pb-1">
                                        {category.replace('_', ' ')}
                                    </h4>
                                    <ul className="space-y-1.5">
                                        {Object.entries(metrics).map(([key, info]) => (
                                            <li key={key} className="flex justify-between items-center text-xs">
                                                <span className="text-gray-400 truncate w-32">{key.replace('_', ' ')}</span>
                                                <span className={`font-mono text-[10px] px-1.5 py-0.5 rounded ${info.status.includes('OK') ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'}`}>
                                                    {info.status}
                                                </span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [viewTab, setViewTab] = useState('dashboard'); // 'dashboard' or 'simulation'
            const [selectedCommodity, setSelectedCommodity] = useState("Brent");
            const [defaultPredictions, setDefaultPredictions] = useState(null);
            const [chartData, setChartData] = useState([]);
            const [healthData, setHealthData] = useState(null);
            
            const [sliders, setSliders] = useState({ A_it: 0.5, D_it: 0.5, R_it: 0.5 });
            const [isSimulating, setIsSimulating] = useState(false);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Fetch from backend
            useEffect(() => {
                Promise.all([
                    fetch(`${API_BASE}/api/v1/predict`).then(res => res.json()),
                    fetch(`${API_BASE}/api/v1/data-status`).then(res => res.json())
                ])
                .then(([predictRes, healthRes]) => {
                    if (predictRes.status === "success" && predictRes.data) {
                        setDefaultPredictions(predictRes.data);
                        setHealthData(healthRes.indices);
                    } else {
                        setError("Engine cache pending. Please trigger calculations.");
                    }
                    setLoading(false);
                })
                .catch(err => {
                    setError("Failed to connect to RWV API.");
                    setLoading(false);
                });
            }, []);

            // Set state when commodity changes
            useEffect(() => {
                if (defaultPredictions && defaultPredictions[selectedCommodity]) {
                    const data = defaultPredictions[selectedCommodity];
                    setSliders({
                        A_it: data.indices.A,
                        D_it: data.indices.D,
                        R_it: data.indices.R,
                    });
                    setChartData(data.projection_curve);
                }
            }, [selectedCommodity, defaultPredictions]);

            // Debounced Custom Simulation call
            useEffect(() => {
                if (!defaultPredictions) return;

                const timer = setTimeout(() => {
                    setIsSimulating(true);
                    
                    fetch(`${API_BASE}/api/v1/simulate-custom`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            commodity: selectedCommodity,
                            A_it: parseFloat(sliders.A_it),
                            D_it: parseFloat(sliders.D_it),
                            R_it: parseFloat(sliders.R_it)
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            setChartData(data.projection_curve);
                        }
                        setIsSimulating(false);
                    })
                    .catch(err => {
                        console.error("Simulation failed", err);
                        setIsSimulating(false);
                    });
                }, 500);

                return () => clearTimeout(timer);
            }, [sliders, selectedCommodity]);

            const handleSliderChange = (e, key) => {
                setSliders(prev => ({ ...prev, [key]: parseFloat(e.target.value) }));
            };

            if (loading) return <div className="flex items-center justify-center min-h-screen text-rwv-lime text-xl font-mono animate-pulse">INITIALIZING TERMINAL...</div>;
            if (error) return <div className="flex items-center justify-center min-h-screen text-red-500 font-mono">{error}</div>;

            const spotPrice = defaultPredictions?.[selectedCommodity]?.spot_price || 0.00;

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    
                    {/* Top Global Navigation Bar */}
                    <div className="h-16 bg-rwv-panel border-b border-rwv-border flex items-center justify-between px-6 shrink-0 z-30">
                        <div className="flex items-center gap-4">
                            <div className="w-8 h-8 bg-rwv-lime rounded flex items-center justify-center shadow-[0_0_15px_rgba(198,243,79,0.3)]">
                                <span className="text-rwv-bg font-black text-xl">R</span>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-white tracking-tight leading-none">REALWORLDVIEW</h1>
                                <p className="text-[10px] text-rwv-lime tracking-widest uppercase mt-0.5">Mathematical Engine</p>
                            </div>
                        </div>
                        
                        <div className="flex gap-2 bg-rwv-bg p-1 rounded-lg border border-rwv-border">
                            <button 
                                onClick={() => setViewTab('dashboard')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'dashboard' ? 'bg-rwv-panel text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                Output Matrix
                            </button>
                            <button 
                                onClick={() => setViewTab('simulation')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'simulation' ? 'bg-rwv-panel text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                Math Pipeline
                            </button>
                        </div>
                    </div>

                    {/* Main Workspace Split */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* Persistent Sidebar (Only visible on Dashboard Tab) */}
                        {viewTab === 'dashboard' && (
                            <div className="w-[340px] bg-rwv-panel border-r border-rwv-border flex flex-col shadow-xl z-20 shrink-0">
                                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar flex flex-col gap-8">
                                    {/* Commodity Selector (Gradient Buttons) */}
                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-3">Target Asset</h2>
                                        <div className="grid grid-cols-2 gap-2">
                                            {COMMODITIES.map(c => (
                                                <button
                                                    key={c}
                                                    onClick={() => setSelectedCommodity(c)}
                                                    className={`w-full text-center px-2 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 border ${
                                                        selectedCommodity === c 
                                                        ? 'bg-gradient-to-br from-rwv-lime to-[#9abf3b] text-rwv-bg border-transparent shadow-[0_0_15px_rgba(198,243,79,0.3)]' 
                                                        : 'bg-rwv-bg text-gray-400 border-rwv-border hover:border-rwv-textMuted hover:text-white'
                                                    }`}
                                                >
                                                    {c}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <hr className="border-rwv-border" />

                                    {/* Macro Sliders */}
                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-4">Live Parameter Tuning</h2>
                                        <div className="flex flex-col gap-6">
                                            <SidebarSlider title="Economic Activity (A_it)" value={sliders.A_it} onChange={(e) => handleSliderChange(e, 'A_it')} />
                                            <SidebarSlider title="Deficit Intensity (D_it)" value={sliders.D_it} onChange={(e) => handleSliderChange(e, 'D_it')} />
                                            <SidebarSlider title="Systemic Risk (R_it)" value={sliders.R_it} onChange={(e) => handleSliderChange(e, 'R_it')} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Dynamic Main View */}
                        {viewTab === 'dashboard' ? (
                            <div className="flex-1 p-8 overflow-y-auto flex flex-col relative bg-rwv-bg">
                                <header className="flex justify-between items-end mb-6">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="text-rwv-textMuted text-sm font-medium">Market /</span>
                                            <span className="text-rwv-lime text-sm font-bold uppercase tracking-wider">{selectedCommodity}</span>
                                        </div>
                                        <h2 className="text-4xl font-bold text-white tracking-tight">{selectedCommodity} <span className="text-gray-500 font-light">/ USD</span></h2>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xs text-rwv-textMuted uppercase tracking-widest mb-1">Spot Anchor</p>
                                        <p className="text-4xl font-mono font-bold text-white">${spotPrice.toFixed(2)}</p>
                                    </div>
                                </header>
                                <ProjectionChart data={chartData} commodity={selectedCommodity} isSimulating={isSimulating} />
                                <Phase3LockedFeatures />
                            </div>
                        ) : (
                            <MathSimulationTab />
                        )}

                        <DataHealthWidget healthData={healthData} />
                    </div>
                </div>
            );
        }

        // --- SIDEBAR SLIDER COMPONENT ---
        function SidebarSlider({ title, value, onChange }) {
            return (
                <div className="flex flex-col">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-semibold text-gray-300">{title}</label>
                        <span className="font-mono text-xs font-bold text-rwv-lime bg-rwv-lime/10 px-2 py-0.5 rounded border border-rwv-lime/20 shadow-[0_0_5px_rgba(198,243,79,0.2)]">
                            {value.toFixed(2)}
                        </span>
                    </div>
                    <input type="range" min="0.00" max="1.00" step="0.01" value={value} onChange={onChange} />
                    <div className="flex justify-between text-[10px] text-rwv-textMuted mt-1.5 font-mono">
                        <span>0.00</span>
                        <span>1.00</span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
